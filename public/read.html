<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Daily Fire — Reading</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" href="/icon-192.png"/>
<meta name="theme-color" content="#0A0A0B"/>
<style>
:root{
  --ink:#0A0A0B; --panel:#16101a; --hot:#FF2E88; --deep:#C2185B;
  --soft:#FF8FC2; --body:#F5E9EF; --faint:#9b8290; --line:#2a1c26; --hl:rgba(255,46,136,.28);
}
html[data-theme="light"]{
  --ink:#FBF4F7; --panel:#ffffff; --hot:#D8126E; --deep:#C2185B;
  --soft:#A8336B; --body:#241019; --faint:#8a6a78; --line:#f0d4e1; --hl:rgba(216,18,110,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--body);font-family:Georgia,'Times New Roman',serif;transition:background .3s}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--hot);width:0;z-index:40}
.bar{position:sticky;top:0;background:var(--ink);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px;z-index:30;font-family:Helvetica,Arial,sans-serif}
.bar a{color:var(--faint);text-decoration:none;font-size:20px}
.bar .ttl{font-size:12px;letter-spacing:2px;color:var(--hot);font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn{background:none;border:1px solid var(--line);color:var(--body);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:Georgia,serif}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px 100px}
.tag{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:2.5px;color:var(--hot);font-weight:700}
h1{font-size:34px;line-height:1.18;margin:14px 0 10px}
.deck{font-style:italic;color:var(--soft);font-size:18px;line-height:1.5;margin-bottom:14px}
.meta{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:1px;color:var(--faint);text-transform:uppercase;margin-bottom:26px}
img.hero{width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:8px}
.cap{font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:1px;color:var(--faint);text-transform:uppercase;margin-bottom:26px}
.essay p{font-size:var(--fs,19px);line-height:1.8;margin-bottom:24px}
.essay p:first-of-type::first-letter{float:left;font-size:3.4em;line-height:.82;padding:6px 10px 0 0;color:var(--hot);font-weight:700}
.rule{width:64px;height:3px;background:var(--hot);margin:34px auto}
.essay strong{color:var(--soft)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.hint{font-family:Helvetica,Arial,sans-serif;font-size:11px;color:var(--faint);text-align:center;letter-spacing:1px;margin-top:40px}
.end{width:64px;height:3px;background:var(--deep);margin:40px auto 16px}
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<nav class="bar">
  <a href="/" aria-label="Back">←</a>
  <div class="ttl" id="barTitle">DAILY FIRE</div>
  <button class="fbtn" onclick="font(-1)">A−</button>
  <button class="fbtn" onclick="font(1)">A+</button>
</nav>
<main class="wrap" id="main"><p style="color:var(--faint);font-style:italic">Fetching the essay…</p></main>

<script>
document.documentElement.setAttribute('data-theme',localStorage.getItem('df-theme')||'dark');

let fs=parseInt(localStorage.getItem('df-fs')||'19');
function applyFs(){document.documentElement.style.setProperty('--fs',fs+'px')}
function font(d){fs=Math.min(26,Math.max(15,fs+d));localStorage.setItem('df-fs',fs);applyFs()}
applyFs();

const u=new URLSearchParams(location.search).get('u');
const main=document.getElementById('main');
const hlKey='df-hl-'+(u||'');

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}

async function load(){
  if(!u){main.innerHTML='<p>No essay specified.</p>';return}
  try{
    const e=await (await fetch(u)).json();
    document.title='Daily Fire — '+e.title;
    document.getElementById('barTitle').textContent=(e.slot==='morning'?'THE FIRE · ':'THE EMBER · ')+e.dateStr.toUpperCase();
    const hero=(e.images&&e.images[0])?`<img class="hero" src="${e.images[0].url}" alt=""/><div class="cap">${esc(e.images[0].caption||'')}</div>`:'';
    const blocks=e.essay.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean)
      .map(b=>/^⸻$/.test(b)?'<div class="rule"></div>':`<p>${md(b).replace(/\n/g,'<br/>')}</p>`).join('');
    main.innerHTML=`<span class="tag">${e.slot==='morning'?'🔥 THE FIRE':'🕯️ THE EMBER'}</span>
      <h1>${esc(e.title)}</h1><div class="deck">${esc(e.deck||'')}</div>
      <div class="meta">${e.dateStr} · ${e.readMins} min read</div>
      ${hero}<article class="essay">${blocks}</article>
      <div class="end"></div><div class="hint">SELECT ANY PASSAGE TO HIGHLIGHT · SAVED ON THIS DEVICE</div>`;
    restoreHighlights();
  }catch{
    main.innerHTML='<p style="font-style:italic;color:var(--faint)">Could not load — you may be offline and this essay isn\'t cached yet.</p>';
  }
}
load();

// ---------- highlights (text-match based, persisted per essay) ----------
function saveHl(list){localStorage.setItem(hlKey,JSON.stringify(list))}
function getHl(){try{return JSON.parse(localStorage.getItem(hlKey)||'[]')}catch{return[]}}
document.addEventListener('selectionchange',()=>{});
document.addEventListener('mouseup',tryHighlight);
document.addEventListener('touchend',()=>setTimeout(tryHighlight,50));
function tryHighlight(){
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)return;
  const text=sel.toString().trim();
  if(text.length<8||text.length>600)return;
  if(!main.contains(sel.anchorNode))return;
  const list=getHl();
  if(!list.includes(text)){list.push(text);saveHl(list);restoreHighlights()}
  sel.removeAllRanges();
}
function restoreHighlights(){
  const art=main.querySelector('.essay');if(!art)return;
  art.querySelectorAll('mark').forEach(m=>{m.replaceWith(...m.childNodes)});
  for(const t of getHl()){
    const walker=document.createTreeWalker(art,NodeFilter.SHOW_TEXT);
    let node;
    while((node=walker.nextNode())){
      const i=node.textContent.indexOf(t);
      if(i>-1){
        const r=document.createRange();
        r.setStart(node,i);r.setEnd(node,i+t.length);
        const m=document.createElement('mark');
        try{r.surroundContents(m)}catch{}
        break;
      }
    }
  }
}

// ---------- progress ----------
addEventListener('scroll',()=>{
  const h=document.documentElement;
  const p=h.scrollTop/(h.scrollHeight-h.clientHeight)*100;
  document.getElementById('prog').style.width=p+'%';
},{passive:true});

if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
